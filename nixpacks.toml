[providers]
python = true

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate",
    "pip install -r backend/requirements.txt",
    "python -m playwright install chromium --with-deps"
]

[start]
cmd = "export PLAYWRIGHT_BROWSERS_PATH=0 && . /opt/venv/bin/activate && cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
