[providers]
python = true

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.setup]
nixPkgs = ["python311", "ffmpeg"]
aptPkgs = [
    "libgbm-dev",
    "libnss3",
    "libatk-bridge2.0-0",
    "libgtk-3-0",
    "libasound2"
]

[start]
cmd = "export PLAYWRIGHT_BROWSERS_PATH=0 && python -m playwright install chromium && cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
